version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evraz_hwstove_db
    environment:
      POSTGRES_USER: ${DB_USER:-evraz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evraz_password}
      POSTGRES_DB: ${DB_NAME:-hwstove_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-evraz_user} -d ${DB_NAME:-hwstove_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: evraz_hwstove_pgdata
