server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: therma-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hwstove_db}
    username: ${DB_USER:evraz_user}
    password: ${DB_PASSWORD:evraz_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: POSTGRES

telemetry:
  stale-threshold-minutes: 3
  frozen-threshold-minutes: 10
  spike-threshold-celsius-per-minute: 50
